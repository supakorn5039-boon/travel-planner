services:
   postgres:
      image: postgres:16
      restart: unless-stopped
      container_name: travel-postgres
      environment:
         POSTGRES_USER: username
         POSTGRES_PASSWORD: password
         POSTGRES_DB: travel
      ports:
         - 5432:5432
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U username -d travel']
         interval: 10s
         timeout: 5s
         retries: 5

      volumes:
         - ./docker/postgres:/var/lib/postgresql/data
